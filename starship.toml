"$schema" = 'https://starship.rs/config-schema.json'

# ──────────────────────────────────────────────
# PROMPT LAYOUT
# Left-to-right order of segments; each separator glyph
# blends the previous segment's color into the next one.
# ──────────────────────────────────────────────
palette = "amber"

format = """
[░▒▓](os_bg)\
$os\
[](bg:dir_bg fg:os_bg)\
$directory\
[](fg:dir_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg bg:lang_bg)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:lang_bg bg:time_bg)\
$time\
[ ](fg:time_bg)\
\n$character"""

# ──────────────────────────────────────────────
# COLOR PALETTE
# Define each color once; change it here to update the whole prompt.
# ──────────────────────────────────────────────
[palettes.amber]
os_bg   = "#ffb86b"
os_fg   = "#2b1408"
dir_bg  = "#e8743b"
dir_fg  = "#2b1408"
git_bg  = "#5a2e1a"
lang_bg = "#3b1f12"
time_bg = "#281610"
time_fg = "#f2b27a"

[palettes.hacker]
os_bg   = "#00ff9c"
os_fg   = "#02100a"
dir_bg  = "#00e5ff"
dir_fg  = "#02100a"
git_bg  = "#0f2a20"
lang_bg = "#0a1d16"
time_bg = "#07140f"
time_fg = "#5cffb8"

[palettes.synthwave]
os_bg   = "#ff2a6d"
os_fg   = "#05010d"
dir_bg  = "#05d9e8"
dir_fg  = "#05010d"
git_bg  = "#731c9e"
lang_bg = "#3a0ca3"
time_bg = "#01012b"
time_fg = "#05d9e8"

# ──────────────────────────────────────────────
# OPERATING SYSTEM
# ──────────────────────────────────────────────
[os]
style = "bg:os_bg fg:os_fg"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# ──────────────────────────────────────────────
# DIRECTORY
# ──────────────────────────────────────────────
[directory]
style = "fg:dir_fg bg:dir_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# ──────────────────────────────────────────────
# VERSION CONTROL (git / jj share the git segment colors)
# ──────────────────────────────────────────────
[git_branch]
symbol = ""
style = "bg:git_bg"
format = '[[ $symbol $branch ](fg:dir_bg bg:git_bg)]($style)'

[git_status]
style = "bg:git_bg"
format = '[[($all_status$ahead_behind )](fg:dir_bg bg:git_bg)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:git_bg"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:dir_bg bg:git_bg)]($style)'

[jj_status]
style = "bg:git_bg"
format = '[[($all )](fg:dir_bg bg:git_bg)]($style)'

# ──────────────────────────────────────────────
# LANGUAGE / RUNTIME VERSIONS
# All share the same style and format; only the symbol differs.
# ──────────────────────────────────────────────
[nodejs]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol ($version) ](fg:dir_bg bg:lang_bg)]($style)'

[bun]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol ($version) ](fg:dir_bg bg:lang_bg)]($style)'

[rust]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol ($version) ](fg:dir_bg bg:lang_bg)]($style)'

[golang]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol ($version) ](fg:dir_bg bg:lang_bg)]($style)'

[php]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol ($version) ](fg:dir_bg bg:lang_bg)]($style)'

# ──────────────────────────────────────────────
# CLOCK
# ──────────────────────────────────────────────
[time]
disabled = false
time_format = "%I:%M %p"  # 12-hour Hour:Minute with AM/PM
style = "bg:time_bg"
format = '[[  $time ](fg:time_fg bg:time_bg)]($style)'
