# ==========================================
# Fonts
# ==========================================
font_family             GeistMono Nerd Font
font_size               12.0

# ==========================================
# Cursor
# ==========================================
cursor_shape            beam
cursor_blink_interval   0.5

# ==========================================
# Window & Background
# ==========================================
hide_window_decorations yes
background_opacity      0.7
background_blur         1
dynamic_background_opacity yes

# ==========================================
# Theme Colors
# ==========================================
# Base
foreground              #f2d9c0
background              #1c110c
selection_foreground    #2b1408
selection_background    #ffb86b

# Cursor
cursor                  #e8743b
cursor_text_color       #2b1408

# Normal
color0                  #3b1f12
color1                  #e0523a
color2                  #a3b565
color3                  #f0a030
color4                  #7ea6c9
color5                  #c47a9a
color6                  #78b3a8
color7                  #cdb9a5

# Bright
color8                  #8a6a55
color9                  #ff7a50
color10                 #c2d38a
color11                 #ffd08a
color12                 #a5c6e3
color13                 #e09ab8
color14                 #9ad3c8
color15                 #fff4e8

# Tab Bar
active_tab_foreground   #2b1408
active_tab_background   #e8743b
inactive_tab_foreground #f2b27a
inactive_tab_background #3b1f12
