# ==========================================
# Fonts
# ==========================================
font_family             GeistMono Nerd Font
font_size               12.0

# ==========================================
# Cursor
# ==========================================
cursor_shape            beam
cursor_blink_interval   0.5

# ==========================================
# Window & Background
# ==========================================
background_opacity      0.7
background_blur         1
dynamic_background_opacity yes
window_padding_width    10

# ==========================================
# Theme Colors
# ==========================================
include themes/amber.conf
